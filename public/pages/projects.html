<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConfigFlow - Projects</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            ⚙️ ConfigFlow
        </div>

        <nav>

    <a href="dashboard.html">
        🏠 Dashboard
    </a>

    <a href="projects.html">
        📁 Projects
    </a>

    <a href="modules.html">
        ▦ Modules
    </a>

    <a href="changeRequests.html">
        🔄 Change Requests
    </a>

    <a href="approval.html" id="approvalLink">
        ✓ Approvals
    </a>

    <a href="versions.html">
        🚀 Versions
    </a>

    <a href="releaseNotes.html">
        📄 Release Notes
    </a>

    <a href="reports.html">
        📊 Reports
    </a>

    <a href="auditLogs.html">
        📋 Audit Logs
    </a>

</nav>

        <div class="sidebar-user">
            <strong id="sidebarUserName">User</strong>
            <span id="sidebarUserRole">Role</span>
        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Projects</h1>
                <p>Manage your software projects</p>
            </div>

            <button class="add-btn" id="addProjectButton" onclick="openProjectForm()" hidden>
                + Add Project
            </button>

        </header>


        <!-- ADD / EDIT PROJECT FORM -->

        <section class="form-section" id="projectFormSection" hidden>

            <h2 id="formTitle">Add Project</h2>

            <input type="hidden" id="projectId">

            <input
                type="text"
                id="projectName"
                placeholder="Project Name"
            >

            <textarea
                id="projectDescription"
                placeholder="Project Description"
            ></textarea>

            <input
                type="text"
                id="currentVersion"
                placeholder="Current Version (example: v1.0.0)"
            >

            <button onclick="saveProject()">
                Save Project
            </button>

            <button
                class="cancel-btn"
                onclick="closeProjectForm()"
            >
                Cancel
            </button>

        </section>


        <!-- PROJECT TABLE -->

        <section class="dashboard-section">

            <div class="section-header">

                <h2>All Projects</h2>

                <span id="projectCount">
                    0 Projects
                </span>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Project Name</th>
                            <th>Description</th>
                            <th>Current Version</th>
                            <th>Assignment</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="projectsTable">

                        <tr>
                            <td colspan="6">
                                Loading...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="../js/projects.js"></script>
    <script src="../js/sidebar.js"></script>
</body>

</html>
