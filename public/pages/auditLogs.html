<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfigFlow - Audit Logs</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-mark">CF</span>
            <span class="logo-text">ConfigFlow</span>
        </div>

        <nav>
            <a href="dashboard.html" data-page="dashboard"><span class="nav-label">Dashboard</span></a>
            <a href="projects.html" data-page="projects"><span class="nav-label">Projects</span></a>
            <a href="modules.html" data-page="modules"><span class="nav-label">Modules</span></a>
            <a href="changeRequests.html" data-page="changeRequests"><span class="nav-label">Change Requests</span></a>
            <a href="approval.html" id="approvalLink" data-page="approvals"><span class="nav-label">Approvals</span></a>
            <a href="versions.html" data-page="versions"><span class="nav-label">Versions</span></a>
            <a href="releaseNotes.html" data-page="releaseNotes"><span class="nav-label">Release Notes</span></a>
            <a href="reports.html" data-page="reports"><span class="nav-label">Reports</span></a>
            <a href="auditLogs.html" class="active" data-page="auditLogs"><span class="nav-label">Audit Logs</span></a>
            <a href="search.html" data-page="search"><span class="nav-label">Search</span></a>
        </nav>

        <div class="sidebar-user">
            <strong id="sidebarUserName">User</strong>
            <span id="sidebarUserRole">Role</span>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Audit Logs</h1>
                <p>Track all important system activities and administrative events</p>
            </div>
        </header>

        <!-- ACTIVITY HISTORY -->
        <section class="dashboard-section">
            <div class="section-header">
                <h2>Activity History</h2>
                <span id="logCount">0 Activities</span>
                <button type="button" class="add-btn" id="exportAuditButton">
                    Export CSV
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Details</th>
                            <th>Date & Time</th>
                        </tr>
                    </thead>
                    <tbody id="auditTable">
                        <tr>
                            <td colspan="5">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../js/icons.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/auditLogs.js"></script>
</body>
</html>
