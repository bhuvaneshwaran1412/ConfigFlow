    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


    <aside class="sidebar">

        <div class="logo">
            ⚙️ ConfigFlow
        </div>


        <nav>

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="projects.html">
                📁 Projects

            <a href="modules.html">

            <a href="changeRequests.html">

            <a href="approval.html" id="approvalLink">✓ Approvals</a>

            <a href="versions.html">

            <a href="reports.html">

            <a href="auditLogs.html" class="active">

        </nav>


        <div class="sidebar-user">

            <strong id="sidebarUserName">
                User
            </strong>

            <span id="sidebarUserRole">
                Role
            </span>

        </div>

    </aside>



    <main class="main-content">


        <header class="topbar">

            <div>

                <h1>
                    Audit Logs
                </h1>

                <p>
                    Track all important system activities
                </p>

            </div>

        </header>



        <section class="dashboard-section">


            <div class="section-header">

                <h2>
                    Activity History
                </h2>

                <span id="logCount">
                    0 Activities
                </span>

                <button type="button" class="add-btn" id="exportAuditButton">
                    Export CSV
                </button>

            </div>



            <div class="table-container">


                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>User</th>

                            <th>Action</th>

                            <th>Details</th>

                            <th>Date & Time</th>

                        </tr>

                    </thead>


                    <tbody id="auditTable">

                        <tr>

                            <td colspan="5">
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>


            </div>


        </section>


    </main>



    <script src="../js/auditLogs.js"></script>
