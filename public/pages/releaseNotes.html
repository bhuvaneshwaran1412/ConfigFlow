<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfigFlow - Release Notes</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-mark">CF</span>
            <span class="logo-text">ConfigFlow</span>
        </div>

        <nav>
            <a href="dashboard.html" data-page="dashboard"><span class="nav-label">Dashboard</span></a>
            <a href="projects.html" data-page="projects"><span class="nav-label">Projects</span></a>
            <a href="modules.html" data-page="modules"><span class="nav-label">Modules</span></a>
            <a href="changeRequests.html" data-page="changeRequests"><span class="nav-label">Change Requests</span></a>
            <a href="approval.html" id="approvalLink" data-page="approvals"><span class="nav-label">Approvals</span></a>
            <a href="versions.html" data-page="versions"><span class="nav-label">Versions</span></a>
            <a href="releaseNotes.html" class="active" data-page="releaseNotes"><span class="nav-label">Release Notes</span></a>
            <a href="reports.html" data-page="reports"><span class="nav-label">Reports</span></a>
            <a href="auditLogs.html" data-page="auditLogs"><span class="nav-label">Audit Logs</span></a>
            <a href="search.html" data-page="search"><span class="nav-label">Search</span></a>
        </nav>

        <div class="sidebar-user">
            <strong id="sidebarUserName">User</strong>
            <span id="sidebarUserRole">Role</span>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Release Notes</h1>
                <p>What changed in each released version</p>
            </div>

            <button type="button" onclick="logout()" class="logout-btn">
                Log out
            </button>
        </header>

        <!-- PUBLISH RELEASE NOTE (ADMIN ONLY) -->
        <section class="form-section" id="releaseNoteFormSection" hidden>
            <div class="section-header">
                <h2>Publish Release Note</h2>
            </div>

            <div class="form-group">
                <label for="releaseVersion">Version</label>
                <select id="releaseVersion">
                    <option value="">Select a version</option>
                </select>
            </div>

            <div class="form-group">
                <label for="releaseNoteText">Release details</label>
                <textarea
                    id="releaseNoteText"
                    rows="6"
                    placeholder="Describe new features, fixes, changes, or breaking changes"
                ></textarea>
            </div>

            <div class="form-actions">
                <button type="button" id="publishReleaseNoteButton">
                    Publish Release Note
                </button>
            </div>

            <p id="releaseNoteMessage"></p>
        </section>

        <!-- PUBLISHED RELEASES LIST -->
        <section class="dashboard-section">
            <div class="section-header">
                <h2>Published releases</h2>
                <span id="releaseNoteCount" class="release-notes-toolbar">Loading...</span>
            </div>

            <div id="releaseNotesContainer" class="release-notes-list">
                <p class="release-notes-status">Loading release notes...</p>
            </div>
        </section>
    </main>

    <script src="../js/icons.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/releaseNotes.js"></script>
</body>
</html>
